<script>
var D={"ru": {"t": "Политика конфиденциальности", "eff": "Приложение «Оракул» (com.zemsk.oraclecards) · Действует с 2 ноября 2026 г.", "dev": "Zemsk Studio", "con": "zemskstudio@gmail.com", "s": [["Кратко", "«Оракул» — приложение для развлечения и самопознания с игральными картами, таро и рунами. Оно не требует регистрации и не собирает ваши имя, почту, телефон или местоположение. Всё, что вы создаёте в приложении (свои описания карт, сохранённые расклады, заметки, настройки), хранится только на вашем устройстве."], ["Кто отвечает за приложение", "Разработчик: {dev}. Связь: {con}."], ["Какие данные хранятся на устройстве", "<ul><li>настройки (язык, тема, размер карт);</li><li>ваши правки описаний карт, сохранённые расклады и заметки в дневнике;</li><li>выбранное время напоминания о карте дня.</li></ul>Эти данные не отправляются разработчику. Они удаляются при удалении приложения или очистке его данных. Вы можете сохранить их в файл и загрузить обратно («Импорт / экспорт»): файл создаётся на вашем устройстве и остаётся у вас."], ["Реклама", "В бесплатной версии показывается реклама Google AdMob. Чтобы показывать и измерять рекламу, Google может обрабатывать рекламный идентификатор устройства, IP-адрес, сведения об устройстве и взаимодействии с рекламой. В странах Европейского экономического пространства, Великобритании и Швейцарии перед показом рекламы приложение запрашивает ваше согласие через форму Google; позже его можно изменить в настройках приложения («Приватность рекламы»). Подробнее: <a href=\"https://policies.google.com/technologies/ads\">policies.google.com/technologies/ads</a>. Покупка «Убрать рекламу» отключает рекламу, и данные для её показа больше не запрашиваются."], ["Покупки", "Оплата проходит через Google Play. Разработчик не получает данные вашей банковской карты. Мы узнаём только то, что покупка совершена, чтобы отключить рекламу."], ["Уведомления и виджет", "Напоминание о карте дня и виджет работают локально на устройстве, без отправки данных. Уведомления можно отключить в настройках приложения или системы."], ["Кнопки «Спросить AI»", "Эта функция собирает текст вашего вопроса и выпавших карт и открывает выбранный вами сервис (например, ChatGPT, Claude, Gemini) в браузере или другом приложении. Текст передаётся этому сервису только по вашему действию, и дальше он обрабатывается по правилам этого сервиса. Не указывайте в вопросе личные данные, которыми не хотите делиться."], ["Дети", "Приложение не предназначено для детей младше 13 лет, и мы сознательно не собираем данные о детях."], ["Безопасность и ваши права", "Мы не создаём учётных записей и не храним ваши данные на своих серверах, поэтому запросы на доступ или удаление данных сводятся к удалению данных приложения на устройстве. По вопросам обработки рекламных данных вы можете обратиться к Google или написать нам."], ["Важно", "Приложение предназначено для развлечения и самопознания. Это не точное предсказание и не замена совета врача, юриста или другого специалиста."], ["Изменения", "При изменении политики мы обновим эту страницу и дату вверху."]], "d": "", "c": ""}, "uk": {"t": "Політика конфіденційності", "eff": "Застосунок «Оракул» (com.zemsk.oraclecards) · Діє з 2 листопада 2026 р.", "dev": "Zemsk Studio", "con": "zemskstudio@gmail.com", "s": [["Коротко", "«Оракул» — застосунок для розваги та самопізнання з гральними картами, таро й рунами. Він не потребує реєстрації й не збирає ваше ім’я, пошту, телефон чи місцезнаходження. Усе, що ви створюєте в застосунку (власні описи карт, збережені розклади, нотатки, налаштування), зберігається лише на вашому пристрої."], ["Хто відповідає за застосунок", "Розробник: {dev}. Зв’язок: {con}."], ["Які дані зберігаються на пристрої", "<ul><li>налаштування (мова, тема, розмір карт);</li><li>ваші правки описів карт, збережені розклади та нотатки в щоденнику;</li><li>обраний час нагадування про карту дня.</li></ul>Ці дані не надсилаються розробнику. Вони видаляються разом із застосунком або після очищення його даних. Ви можете зберегти їх у файл і завантажити назад («Імпорт / експорт»): файл створюється на вашому пристрої й залишається у вас."], ["Реклама", "У безкоштовній версії показується реклама Google AdMob. Щоб показувати й вимірювати рекламу, Google може обробляти рекламний ідентифікатор пристрою, IP-адресу, відомості про пристрій і взаємодію з рекламою. У країнах Європейської економічної зони, Великій Британії та Швейцарії перед показом реклами застосунок запитує вашу згоду через форму Google; пізніше її можна змінити в налаштуваннях («Приватність реклами»). Докладніше: <a href=\"https://policies.google.com/technologies/ads\">policies.google.com/technologies/ads</a>. Покупка «Прибрати рекламу» вимикає рекламу, і дані для її показу більше не запитуються."], ["Покупки", "Оплата відбувається через Google Play. Розробник не отримує дані вашої банківської картки. Ми дізнаємося лише про те, що покупку здійснено, щоб вимкнути рекламу."], ["Сповіщення та віджет", "Нагадування про карту дня та віджет працюють локально на пристрої, без надсилання даних. Сповіщення можна вимкнути в налаштуваннях застосунку чи системи."], ["Кнопки «Запитати ШІ»", "Ця функція збирає текст вашого запитання та карт, що випали, і відкриває обраний вами сервіс (наприклад, ChatGPT, Claude, Gemini) у браузері чи іншому застосунку. Текст передається цьому сервісу лише за вашою дією й далі обробляється за правилами цього сервісу. Не вказуйте в запитанні особисті дані, якими не хочете ділитися."], ["Діти", "Застосунок не призначений для дітей до 13 років, і ми свідомо не збираємо дані про дітей."], ["Безпека та ваші права", "Ми не створюємо облікових записів і не зберігаємо ваші дані на своїх серверах, тому запити на доступ чи видалення даних зводяться до видалення даних застосунку на пристрої. З питань обробки рекламних даних ви можете звернутися до Google або написати нам."], ["Важливо", "Застосунок призначений для розваги та самопізнання. Це не точне передбачення й не заміна поради лікаря, юриста чи іншого фахівця."], ["Зміни", "Якщо політика зміниться, ми оновимо цю сторінку й дату вгорі."]], "d": "", "c": ""}, "en": {"t": "Privacy Policy", "eff": "“Oracle” app (com.zemsk.oraclecards) · Effective 2 November 2026", "dev": "Zemsk Studio", "con": "zemskstudio@gmail.com", "s": [["In short", "“Oracle” is an entertainment and self-reflection app with playing cards, tarot and runes. It needs no sign-up and does not collect your name, email, phone number or location. Everything you create in the app (your own card descriptions, saved spreads, notes, settings) is stored only on your device."], ["Who is responsible", "Developer: {dev}. Contact: {con}."], ["Data stored on your device", "<ul><li>settings (language, theme, card size);</li><li>your edits to card descriptions, saved spreads and diary notes;</li><li>the time you choose for the card-of-the-day reminder.</li></ul>This data is not sent to the developer. It is removed when you uninstall the app or clear its data. You can save it to a file and load it back (“Import / export”): the file is created on your device and stays with you."], ["Advertising", "The free version shows ads from Google AdMob. To serve and measure ads, Google may process the device advertising ID, IP address, device information and your interaction with ads. In the European Economic Area, the United Kingdom and Switzerland, the app asks for your consent through a Google form before showing ads; you can change it later in the app settings (“Ad privacy settings”). More: <a href=\"https://policies.google.com/technologies/ads\">policies.google.com/technologies/ads</a>. The “Remove ads” purchase turns ads off, and no data for serving ads is requested any more."], ["Purchases", "Payment is handled by Google Play. The developer does not receive your card details. We only learn that the purchase was made, so that ads can be turned off."], ["Notifications and widget", "The card-of-the-day reminder and the widget work locally on your device and send no data. You can turn notifications off in the app or system settings."], ["“Ask AI” buttons", "This feature assembles the text of your question and the cards drawn, and opens the service you choose (for example ChatGPT, Claude, Gemini) in a browser or another app. The text goes to that service only through your action and is then handled under that service’s own rules. Do not include personal information in your question that you do not want to share."], ["Children", "The app is not directed to children under 13 and we do not knowingly collect data about children."], ["Security and your rights", "We create no accounts and keep none of your data on our servers, so requests for access or deletion come down to deleting the app’s data on your device. For questions about advertising data you can contact Google or write to us."], ["Please note", "The app is for entertainment and self-reflection. It is not an exact prediction and does not replace advice from a doctor, lawyer or other professional."], ["Changes", "If this policy changes we will update this page and the date above."]], "d": "", "c": ""}, "ro": {"t": "Politica de confidențialitate", "eff": "Aplicația „Oracol” (com.zemsk.oraclecards) · În vigoare din 2 noiembrie 2026", "dev": "Zemsk Studio", "con": "zemskstudio@gmail.com", "s": [["Pe scurt", "„Oracol” este o aplicație de divertisment și autocunoaștere cu cărți de joc, tarot și rune. Nu cere înregistrare și nu colectează numele, e-mailul, telefonul sau locația ta. Tot ce creezi în aplicație (descrieri proprii ale cărților, extrageri salvate, notițe, setări) se păstrează doar pe dispozitivul tău."], ["Cine răspunde", "Dezvoltator: {dev}. Contact: {con}."], ["Date păstrate pe dispozitiv", "<ul><li>setări (limbă, temă, mărimea cărților);</li><li>modificările tale la descrieri, extragerile salvate și notițele din jurnal;</li><li>ora aleasă pentru memento-ul cărții zilei.</li></ul>Aceste date nu sunt trimise dezvoltatorului. Se șterg la dezinstalarea aplicației sau la golirea datelor ei. Le poți salva într-un fișier și le poți încărca înapoi („Import / export”): fișierul se creează pe dispozitivul tău și rămâne la tine."], ["Publicitate", "Versiunea gratuită afișează reclame Google AdMob. Pentru a afișa și măsura reclamele, Google poate prelucra ID-ul de publicitate al dispozitivului, adresa IP, informații despre dispozitiv și interacțiunea cu reclamele. În Spațiul Economic European, Regatul Unit și Elveția, aplicația îți cere acordul printr-un formular Google înainte de a afișa reclame; îl poți modifica ulterior în setări („Confidențialitatea reclamelor”). Detalii: <a href=\"https://policies.google.com/technologies/ads\">policies.google.com/technologies/ads</a>. Achiziția „Elimină reclamele” oprește reclamele și nu se mai solicită date pentru afișarea lor."], ["Achiziții", "Plata se face prin Google Play. Dezvoltatorul nu primește datele cardului tău. Aflăm doar că achiziția a fost făcută, ca să oprim reclamele."], ["Notificări și widget", "Memento-ul cărții zilei și widgetul funcționează local pe dispozitiv și nu trimit date. Poți opri notificările din setările aplicației sau ale sistemului."], ["Butoanele „Întreabă AI”", "Această funcție adună textul întrebării tale și al cărților extrase și deschide serviciul ales de tine (de exemplu ChatGPT, Claude, Gemini) într-un browser sau altă aplicație. Textul ajunge la acel serviciu doar prin acțiunea ta și apoi este tratat după regulile serviciului. Nu include în întrebare date personale pe care nu vrei să le împărtășești."], ["Copii", "Aplicația nu este destinată copiilor sub 13 ani și nu colectăm cu bună știință date despre copii."], ["Securitate și drepturile tale", "Nu creăm conturi și nu păstrăm datele tale pe serverele noastre, deci cererile de acces sau ștergere se reduc la ștergerea datelor aplicației de pe dispozitiv. Pentru întrebări despre datele publicitare poți contacta Google sau ne poți scrie."], ["Important", "Aplicația este pentru divertisment și autocunoaștere. Nu este o predicție exactă și nu înlocuiește sfatul unui medic, avocat sau alt specialist."], ["Modificări", "Dacă politica se schimbă, vom actualiza această pagină și data de mai sus."]], "d": "", "c": ""}, "es": {"t": "Política de privacidad", "eff": "Aplicación «Oráculo» (com.zemsk.oraclecards) · En vigor desde el 2 de noviembre de 2026", "dev": "Zemsk Studio", "con": "zemskstudio@gmail.com", "s": [["En breve", "«Oráculo» es una aplicación de entretenimiento y autoconocimiento con baraja, tarot y runas. No requiere registro ni recoge tu nombre, correo, teléfono o ubicación. Todo lo que creas en la aplicación (tus descripciones de cartas, tiradas guardadas, notas, ajustes) se guarda solo en tu dispositivo."], ["Quién es responsable", "Desarrollador: {dev}. Contacto: {con}."], ["Datos guardados en el dispositivo", "<ul><li>ajustes (idioma, tema, tamaño de las cartas);</li><li>tus cambios en las descripciones, las tiradas guardadas y las notas del diario;</li><li>la hora elegida para el recordatorio de la carta del día.</li></ul>Estos datos no se envían al desarrollador. Se eliminan al desinstalar la aplicación o borrar sus datos. Puedes guardarlos en un archivo y cargarlos de nuevo («Importar / exportar»): el archivo se crea en tu dispositivo y se queda contigo."], ["Publicidad", "La versión gratuita muestra anuncios de Google AdMob. Para mostrar y medir los anuncios, Google puede tratar el identificador publicitario del dispositivo, la dirección IP, datos del dispositivo y tu interacción con los anuncios. En el Espacio Económico Europeo, el Reino Unido y Suiza, la aplicación pide tu consentimiento mediante un formulario de Google antes de mostrar anuncios; puedes cambiarlo más tarde en los ajustes («Privacidad de los anuncios»). Más información: <a href=\"https://policies.google.com/technologies/ads\">policies.google.com/technologies/ads</a>. La compra «Quitar anuncios» los desactiva y ya no se solicitan datos para mostrarlos."], ["Compras", "El pago se gestiona a través de Google Play. El desarrollador no recibe los datos de tu tarjeta. Solo sabemos que la compra se realizó, para poder desactivar los anuncios."], ["Notificaciones y widget", "El recordatorio de la carta del día y el widget funcionan localmente en tu dispositivo y no envían datos. Puedes desactivar las notificaciones en los ajustes de la aplicación o del sistema."], ["Botones «Preguntar a la IA»", "Esta función reúne el texto de tu pregunta y de las cartas sacadas y abre el servicio que elijas (por ejemplo ChatGPT, Claude, Gemini) en un navegador u otra aplicación. El texto llega a ese servicio solo por una acción tuya y después se trata según las reglas de ese servicio. No incluyas en la pregunta datos personales que no quieras compartir."], ["Menores", "La aplicación no está dirigida a menores de 13 años y no recogemos a sabiendas datos de menores."], ["Seguridad y tus derechos", "No creamos cuentas ni guardamos tus datos en nuestros servidores, por lo que las solicitudes de acceso o eliminación se reducen a borrar los datos de la aplicación en tu dispositivo. Para dudas sobre los datos publicitarios puedes contactar con Google o escribirnos."], ["Importante", "La aplicación es para entretenimiento y autoconocimiento. No es una predicción exacta ni sustituye el consejo de un médico, abogado u otro profesional."], ["Cambios", "Si la política cambia, actualizaremos esta página y la fecha de arriba."]], "d": "", "c": ""}, "pt": {"t": "Política de privacidade", "eff": "Aplicativo «Oráculo» (com.zemsk.oraclecards) · Em vigor desde 2 de novembro de 2026", "dev": "Zemsk Studio", "con": "zemskstudio@gmail.com", "s": [["Em resumo", "«Oráculo» é um aplicativo de entretenimento e autoconhecimento com baralho, tarô e runas. Não exige cadastro nem coleta seu nome, e-mail, telefone ou localização. Tudo o que você cria no aplicativo (suas descrições de cartas, tiragens salvas, notas, configurações) fica guardado apenas no seu dispositivo."], ["Quem é responsável", "Desenvolvedor: {dev}. Contato: {con}."], ["Dados guardados no dispositivo", "<ul><li>configurações (idioma, tema, tamanho das cartas);</li><li>suas alterações nas descrições, as tiragens salvas e as notas do diário;</li><li>o horário escolhido para o lembrete da carta do dia.</li></ul>Esses dados não são enviados ao desenvolvedor. São apagados ao desinstalar o aplicativo ou limpar seus dados. Você pode salvá-los em um arquivo e carregá-los de volta («Importar / exportar»): o arquivo é criado no seu dispositivo e fica com você."], ["Publicidade", "A versão gratuita mostra anúncios do Google AdMob. Para exibir e medir os anúncios, o Google pode tratar o ID de publicidade do dispositivo, o endereço IP, dados do dispositivo e a sua interação com os anúncios. No Espaço Econômico Europeu, no Reino Unido e na Suíça, o aplicativo pede seu consentimento por um formulário do Google antes de exibir anúncios; você pode alterá-lo depois nas configurações («Privacidade dos anúncios»). Mais informações: <a href=\"https://policies.google.com/technologies/ads\">policies.google.com/technologies/ads</a>. A compra «Remover anúncios» desativa os anúncios e não se solicitam mais dados para exibi-los."], ["Compras", "O pagamento é feito pelo Google Play. O desenvolvedor não recebe os dados do seu cartão. Apenas sabemos que a compra foi feita, para desativar os anúncios."], ["Notificações e widget", "O lembrete da carta do dia e o widget funcionam localmente no dispositivo e não enviam dados. Você pode desativar as notificações nas configurações do aplicativo ou do sistema."], ["Botões «Pergunte à IA»", "Este recurso reúne o texto da sua pergunta e das cartas tiradas e abre o serviço que você escolher (por exemplo ChatGPT, Claude, Gemini) em um navegador ou outro aplicativo. O texto chega a esse serviço apenas por uma ação sua e depois é tratado pelas regras dele. Não inclua na pergunta dados pessoais que não queira compartilhar."], ["Crianças", "O aplicativo não é destinado a menores de 13 anos e não coletamos conscientemente dados de crianças."], ["Segurança e seus direitos", "Não criamos contas nem guardamos seus dados em nossos servidores, então pedidos de acesso ou exclusão se resumem a apagar os dados do aplicativo no dispositivo. Para dúvidas sobre dados de publicidade, você pode contatar o Google ou escrever para nós."], ["Importante", "O aplicativo é para entretenimento e autoconhecimento. Não é uma previsão exata nem substitui o conselho de médico, advogado ou outro profissional."], ["Alterações", "Se a política mudar, atualizaremos esta página e a data acima."]], "d": "", "c": ""}, "de": {"t": "Datenschutzerklärung", "eff": "App „Orakel“ (com.zemsk.oraclecards) · Gültig ab 2. November 2026", "dev": "Zemsk Studio", "con": "zemskstudio@gmail.com", "s": [["Kurz gesagt", "„Orakel“ ist eine Unterhaltungs- und Selbstreflexions-App mit Spielkarten, Tarot und Runen. Sie braucht keine Anmeldung und erhebt weder Namen, E-Mail, Telefonnummer noch Standort. Alles, was du in der App erstellst (eigene Kartenbeschreibungen, gespeicherte Legungen, Notizen, Einstellungen), bleibt nur auf deinem Gerät."], ["Verantwortlich", "Entwickler: {dev}. Kontakt: {con}."], ["Auf dem Gerät gespeicherte Daten", "<ul><li>Einstellungen (Sprache, Design, Kartengröße);</li><li>deine Änderungen an Beschreibungen, gespeicherte Legungen und Tagebuchnotizen;</li><li>die gewählte Uhrzeit der Tageskarten-Erinnerung.</li></ul>Diese Daten werden nicht an den Entwickler gesendet. Sie werden beim Deinstallieren der App oder beim Löschen ihrer Daten entfernt. Du kannst sie in einer Datei sichern und wieder laden („Import / Export“): Die Datei entsteht auf deinem Gerät und bleibt bei dir."], ["Werbung", "Die kostenlose Version zeigt Werbung von Google AdMob. Zum Ausspielen und Messen der Werbung kann Google die Werbe-ID des Geräts, die IP-Adresse, Geräteinformationen und deine Interaktion mit Anzeigen verarbeiten. Im Europäischen Wirtschaftsraum, im Vereinigten Königreich und in der Schweiz fragt die App vor der Werbung über ein Google-Formular nach deiner Einwilligung; du kannst sie später in den Einstellungen ändern („Datenschutz für Werbung“). Mehr: <a href=\"https://policies.google.com/technologies/ads\">policies.google.com/technologies/ads</a>. Der Kauf „Werbung entfernen“ schaltet die Werbung ab, und es werden keine Daten mehr dafür angefordert."], ["Käufe", "Die Zahlung läuft über Google Play. Der Entwickler erhält deine Kartendaten nicht. Wir erfahren nur, dass der Kauf erfolgt ist, damit die Werbung abgeschaltet werden kann."], ["Benachrichtigungen und Widget", "Die Tageskarten-Erinnerung und das Widget arbeiten lokal auf deinem Gerät und senden keine Daten. Benachrichtigungen kannst du in den App- oder Systemeinstellungen ausschalten."], ["Schaltflächen „KI fragen“", "Diese Funktion stellt den Text deiner Frage und der gezogenen Karten zusammen und öffnet den von dir gewählten Dienst (zum Beispiel ChatGPT, Claude, Gemini) in einem Browser oder einer anderen App. Der Text gelangt nur durch deine Handlung zu diesem Dienst und wird danach nach dessen Regeln verarbeitet. Gib in der Frage keine persönlichen Daten an, die du nicht teilen möchtest."], ["Kinder", "Die App richtet sich nicht an Kinder unter 13 Jahren, und wir erheben wissentlich keine Daten von Kindern."], ["Sicherheit und deine Rechte", "Wir legen keine Konten an und speichern keine deiner Daten auf unseren Servern; Anfragen auf Auskunft oder Löschung laufen daher auf das Löschen der App-Daten auf deinem Gerät hinaus. Bei Fragen zu Werbedaten kannst du dich an Google wenden oder uns schreiben."], ["Wichtig", "Die App dient der Unterhaltung und Selbstreflexion. Sie ist keine genaue Vorhersage und ersetzt nicht den Rat von Arzt, Anwalt oder anderen Fachleuten."], ["Änderungen", "Ändert sich diese Erklärung, aktualisieren wir diese Seite und das Datum oben."]], "d": "", "c": ""}, "fr": {"t": "Politique de confidentialité", "eff": "Application « Oracle » (com.zemsk.oraclecards) · En vigueur depuis le 2 novembre 2026", "dev": "Zemsk Studio", "con": "zemskstudio@gmail.com", "s": [["En bref", "« Oracle » est une application de divertissement et de réflexion sur soi avec cartes à jouer, tarot et runes. Elle ne demande aucune inscription et ne collecte ni votre nom, ni votre e-mail, ni votre téléphone, ni votre position. Tout ce que vous créez dans l’application (vos descriptions de cartes, tirages enregistrés, notes, réglages) reste uniquement sur votre appareil."], ["Responsable", "Développeur : {dev}. Contact : {con}."], ["Données stockées sur l’appareil", "<ul><li>réglages (langue, thème, taille des cartes) ;</li><li>vos modifications des descriptions, les tirages enregistrés et les notes du journal ;</li><li>l’heure choisie pour le rappel de la carte du jour.</li></ul>Ces données ne sont pas envoyées au développeur. Elles sont supprimées à la désinstallation de l’application ou à l’effacement de ses données. Vous pouvez les enregistrer dans un fichier et les recharger (« Import / export ») : le fichier est créé sur votre appareil et reste chez vous."], ["Publicité", "La version gratuite affiche des publicités Google AdMob. Pour diffuser et mesurer les publicités, Google peut traiter l’identifiant publicitaire de l’appareil, l’adresse IP, des informations sur l’appareil et votre interaction avec les annonces. Dans l’Espace économique européen, au Royaume-Uni et en Suisse, l’application demande votre consentement via un formulaire Google avant d’afficher des publicités ; vous pouvez le modifier plus tard dans les réglages (« Confidentialité des publicités »). En savoir plus : <a href=\"https://policies.google.com/technologies/ads\">policies.google.com/technologies/ads</a>. L’achat « Supprimer les pubs » désactive les publicités et plus aucune donnée n’est demandée pour les afficher."], ["Achats", "Le paiement est géré par Google Play. Le développeur ne reçoit pas les données de votre carte. Nous savons seulement que l’achat a été effectué, afin de désactiver les publicités."], ["Notifications et widget", "Le rappel de la carte du jour et le widget fonctionnent localement sur votre appareil et n’envoient aucune donnée. Vous pouvez désactiver les notifications dans les réglages de l’application ou du système."], ["Boutons « Demander à l’IA »", "Cette fonction assemble le texte de votre question et des cartes tirées, puis ouvre le service de votre choix (par exemple ChatGPT, Claude, Gemini) dans un navigateur ou une autre application. Le texte n’est transmis à ce service que par votre action, puis traité selon ses propres règles. N’indiquez pas dans la question de données personnelles que vous ne souhaitez pas partager."], ["Enfants", "L’application n’est pas destinée aux enfants de moins de 13 ans et nous ne collectons pas sciemment de données sur les enfants."], ["Sécurité et vos droits", "Nous ne créons pas de comptes et ne conservons aucune de vos données sur nos serveurs ; les demandes d’accès ou de suppression se résument donc à effacer les données de l’application sur votre appareil. Pour toute question sur les données publicitaires, vous pouvez contacter Google ou nous écrire."], ["À noter", "L’application est destinée au divertissement et à la réflexion sur soi. Ce n’est pas une prédiction exacte et elle ne remplace pas l’avis d’un médecin, d’un avocat ou d’un autre professionnel."], ["Modifications", "Si cette politique change, nous mettrons à jour cette page et la date ci-dessus."]], "d": "", "c": ""}, "it": {"t": "Informativa sulla privacy", "eff": "App «Oracolo» (com.zemsk.oraclecards) · In vigore dal 2 novembre 2026", "dev": "Zemsk Studio", "con": "zemskstudio@gmail.com", "s": [["In breve", "«Oracolo» è un'app di intrattenimento e riflessione su di sé con carte da gioco, tarocchi e rune. Non richiede registrazione e non raccoglie nome, e-mail, telefono o posizione. Tutto ciò che crei nell'app (descrizioni delle carte, stese salvate, note, impostazioni) resta solo sul tuo dispositivo."], ["Chi è responsabile", "Sviluppatore: {dev}. Contatto: {con}."], ["Dati conservati sul dispositivo", "<ul><li>impostazioni (lingua, tema, dimensione delle carte);</li><li>le tue modifiche alle descrizioni, le stese salvate e le note del diario;</li><li>l'ora scelta per il promemoria della carta del giorno.</li></ul>Questi dati non vengono inviati allo sviluppatore. Si cancellano disinstallando l'app o svuotandone i dati. Puoi salvarli in un file e ricaricarli («Importa / esporta»): il file viene creato sul tuo dispositivo e resta con te."], ["Pubblicità", "La versione gratuita mostra annunci di Google AdMob. Per mostrare e misurare gli annunci, Google può trattare l'ID pubblicitario del dispositivo, l'indirizzo IP, informazioni sul dispositivo e la tua interazione con gli annunci. Nello Spazio economico europeo, nel Regno Unito e in Svizzera, l'app chiede il tuo consenso tramite un modulo Google prima di mostrare annunci; puoi cambiarlo in seguito nelle impostazioni («Privacy della pubblicità»). Maggiori informazioni: <a href=\"https://policies.google.com/technologies/ads\">policies.google.com/technologies/ads</a>. L'acquisto «Rimuovi la pubblicità» disattiva gli annunci e non vengono più richiesti dati per mostrarli."], ["Acquisti", "Il pagamento è gestito da Google Play. Lo sviluppatore non riceve i dati della tua carta. Sappiamo solo che l'acquisto è avvenuto, per poter disattivare la pubblicità."], ["Notifiche e widget", "Il promemoria della carta del giorno e il widget funzionano in locale sul dispositivo e non inviano dati. Puoi disattivare le notifiche nelle impostazioni dell'app o del sistema."], ["Pulsanti «Chiedi all'IA»", "Questa funzione assembla il testo della tua domanda e delle carte pescate e apre il servizio che scegli (per esempio ChatGPT, Claude, Gemini) in un browser o in un'altra app. Il testo arriva a quel servizio solo con una tua azione e poi viene trattato secondo le regole del servizio. Non inserire nella domanda dati personali che non vuoi condividere."], ["Minori", "L'app non è destinata ai minori di 13 anni e non raccogliamo consapevolmente dati di minori."], ["Sicurezza e i tuoi diritti", "Non creiamo account e non conserviamo i tuoi dati sui nostri server, quindi le richieste di accesso o cancellazione si riducono alla cancellazione dei dati dell'app sul dispositivo. Per domande sui dati pubblicitari puoi contattare Google o scriverci."], ["Importante", "L'app è per intrattenimento e riflessione su di sé. Non è una previsione esatta e non sostituisce il parere di un medico, un avvocato o un altro professionista."], ["Modifiche", "Se l'informativa cambia, aggiorneremo questa pagina e la data in alto."]], "d": "", "c": ""}, "pl": {"t": "Polityka prywatności", "eff": "Aplikacja „Wyrocznia” (com.zemsk.oraclecards) · Obowiązuje od 2 listopada 2026", "dev": "Zemsk Studio", "con": "zemskstudio@gmail.com", "s": [["W skrócie", "„Wyrocznia” to aplikacja rozrywkowa i do samopoznania z kartami do gry, tarotem i runami. Nie wymaga rejestracji i nie zbiera twojego imienia, e-maila, telefonu ani lokalizacji. Wszystko, co tworzysz w aplikacji (własne opisy kart, zapisane układy, notatki, ustawienia), jest przechowywane wyłącznie na twoim urządzeniu."], ["Kto odpowiada", "Twórca: {dev}. Kontakt: {con}."], ["Dane przechowywane na urządzeniu", "<ul><li>ustawienia (język, motyw, rozmiar kart);</li><li>twoje zmiany opisów, zapisane układy i notatki w dzienniku;</li><li>wybrana godzina przypomnienia o karcie dnia.</li></ul>Te dane nie są wysyłane twórcy. Są usuwane po odinstalowaniu aplikacji lub wyczyszczeniu jej danych. Możesz zapisać je do pliku i wczytać z powrotem („Import / eksport”): plik powstaje na twoim urządzeniu i zostaje u ciebie."], ["Reklamy", "Darmowa wersja wyświetla reklamy Google AdMob. Aby wyświetlać i mierzyć reklamy, Google może przetwarzać identyfikator reklamowy urządzenia, adres IP, dane o urządzeniu i twoją interakcję z reklamami. W Europejskim Obszarze Gospodarczym, Wielkiej Brytanii i Szwajcarii aplikacja przed wyświetleniem reklam prosi o zgodę przez formularz Google; możesz ją później zmienić w ustawieniach („Prywatność reklam”). Więcej: <a href=\"https://policies.google.com/technologies/ads\">policies.google.com/technologies/ads</a>. Zakup „Usuń reklamy” wyłącza reklamy i nie są już pobierane dane do ich wyświetlania."], ["Zakupy", "Płatność obsługuje Google Play. Twórca nie otrzymuje danych twojej karty. Wiemy tylko, że zakup został dokonany, aby wyłączyć reklamy."], ["Powiadomienia i widżet", "Przypomnienie o karcie dnia i widżet działają lokalnie na urządzeniu i nie wysyłają danych. Powiadomienia możesz wyłączyć w ustawieniach aplikacji lub systemu."], ["Przyciski „Zapytaj AI”", "Ta funkcja składa tekst twojego pytania i wyciągniętych kart i otwiera wybraną przez ciebie usługę (np. ChatGPT, Claude, Gemini) w przeglądarce lub innej aplikacji. Tekst trafia do tej usługi tylko przez twoje działanie i jest dalej przetwarzany według jej zasad. Nie podawaj w pytaniu danych osobowych, którymi nie chcesz się dzielić."], ["Dzieci", "Aplikacja nie jest skierowana do dzieci poniżej 13 lat i świadomie nie zbieramy danych o dzieciach."], ["Bezpieczeństwo i twoje prawa", "Nie tworzymy kont i nie przechowujemy twoich danych na naszych serwerach, więc prośby o dostęp lub usunięcie sprowadzają się do usunięcia danych aplikacji na urządzeniu. W sprawie danych reklamowych możesz skontaktować się z Google lub napisać do nas."], ["Ważne", "Aplikacja służy rozrywce i samopoznaniu. Nie jest dokładną przepowiednią i nie zastępuje porady lekarza, prawnika ani innego specjalisty."], ["Zmiany", "Jeśli polityka się zmieni, zaktualizujemy tę stronę i datę u góry."]], "d": "", "c": ""}, "tr": {"t": "Gizlilik Politikası", "eff": "“Kahin” uygulaması (com.zemsk.oraclecards) · 2 Kasım 2026 tarihinden itibaren geçerlidir", "dev": "Zemsk Studio", "con": "zemskstudio@gmail.com", "s": [["Kısaca", "“Kahin”, oyun kartları, tarot ve rünlerle eğlence ve kendini tanıma uygulamasıdır. Kayıt gerektirmez ve adını, e-postanı, telefonunu ya da konumunu toplamaz. Uygulamada oluşturduğun her şey (kendi kart açıklamaların, kayıtlı açılımlar, notlar, ayarlar) yalnızca cihazında saklanır."], ["Sorumlu kişi", "Geliştirici: {dev}. İletişim: {con}."], ["Cihazda saklanan veriler", "<ul><li>ayarlar (dil, tema, kart boyutu);</li><li>açıklamalarda yaptığın değişiklikler, kayıtlı açılımlar ve günlük notları;</li><li>günün kartı hatırlatıcısı için seçtiğin saat.</li></ul>Bu veriler geliştiriciye gönderilmez. Uygulamayı kaldırdığında ya da verilerini temizlediğinde silinir. Bunları bir dosyaya kaydedip geri yükleyebilirsin (“İçe / dışa aktar”): dosya cihazında oluşur ve sende kalır."], ["Reklam", "Ücretsiz sürümde Google AdMob reklamları gösterilir. Reklamları göstermek ve ölçmek için Google; cihazın reklam kimliğini, IP adresini, cihaz bilgilerini ve reklamlarla etkileşimini işleyebilir. Avrupa Ekonomik Alanı, Birleşik Krallık ve İsviçre’de uygulama, reklam göstermeden önce Google formu üzerinden onayını ister; bunu sonra ayarlardan değiştirebilirsin (“Reklam gizliliği”). Ayrıntılar: <a href=\"https://policies.google.com/technologies/ads\">policies.google.com/technologies/ads</a>. “Reklamları kaldır” satın alımı reklamları kapatır ve gösterim için artık veri istenmez."], ["Satın alımlar", "Ödeme Google Play üzerinden yapılır. Geliştirici kart bilgilerini almaz. Yalnızca satın alımın yapıldığını öğreniriz; böylece reklamlar kapatılabilir."], ["Bildirimler ve widget", "Günün kartı hatırlatıcısı ve widget cihazında yerel olarak çalışır ve veri göndermez. Bildirimleri uygulama veya sistem ayarlarından kapatabilirsin."], ["“Yapay zekâya sor” düğmeleri", "Bu özellik sorunun ve çekilen kartların metnini bir araya getirir ve seçtiğin hizmeti (örneğin ChatGPT, Claude, Gemini) tarayıcıda veya başka bir uygulamada açar. Metin bu hizmete yalnızca senin işlemin ile ulaşır ve sonrasında o hizmetin kurallarına göre işlenir. Soruna paylaşmak istemediğin kişisel bilgileri yazma."], ["Çocuklar", "Uygulama 13 yaşından küçük çocuklara yönelik değildir ve çocuklara ait verileri bilerek toplamayız."], ["Güvenlik ve haklarınız", "Hesap oluşturmayız ve verilerini sunucularımızda saklamayız; bu yüzden erişim veya silme talepleri, uygulama verilerinin cihazından silinmesine indirgenir. Reklam verileriyle ilgili sorular için Google ile iletişime geçebilir veya bize yazabilirsin."], ["Önemli", "Uygulama eğlence ve kendini tanıma içindir. Kesin bir kehanet değildir ve doktor, avukat ya da başka bir uzmanın tavsiyesinin yerini tutmaz."], ["Değişiklikler", "Politika değişirse bu sayfayı ve yukarıdaki tarihi güncelleriz."]], "d": "", "c": ""}};
var N={"ru": "Русский", "uk": "Українська", "en": "English", "ro": "Română", "es": "Español", "pt": "Português", "de": "Deutsch", "fr": "Français", "it": "Italiano", "pl": "Polski", "tr": "Türkçe"};

function show(l){
  var d=D[l]; if(!d) l='en', d=D.en;
  document.documentElement.lang=l; document.title=d.t+' · Oracle';
  var ph=function(t){return t.indexOf('@')>0?'<a href="mailto:'+t+'">'+t+'</a>':'<strong>'+t+'</strong>';};
  var h='<h1>'+d.t+'</h1><div class="sub">'+d.eff+'</div>';
  d.s.forEach(function(s){ h+='<h2>'+s[0]+'</h2><p>'+s[1].replace('{dev}',ph(d.dev)).replace('{con}',ph(d.con))+'</p>'; });
  document.getElementById('doc').innerHTML=h;
  document.querySelectorAll('#tabs button').forEach(function(b){ b.setAttribute('aria-pressed',b.dataset.l===l); });
  try{ if(location.hash.slice(1)!==l) history.replaceState(null,'','#'+l); }catch(e){}
}
var tabs=document.getElementById('tabs');
Object.keys(N).forEach(function(l){ var b=document.createElement('button'); b.dataset.l=l; b.textContent=N[l]; b.onclick=function(){show(l)}; tabs.appendChild(b); });
var start=(location.hash||'').slice(1); if(!D[start]) start=((navigator.language||'en').slice(0,2).toLowerCase()); if(!D[start]) start='en';
show(start);
window.addEventListener('hashchange',function(){var h=location.hash.slice(1); if(D[h]) show(h);});
</script>
